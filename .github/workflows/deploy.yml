name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd gitrepos/html_projects
            # Undo the previous deploy's cache-bust stamps so the pull sees a clean tree
            git checkout -- '*.html'
            git pull
            # Cache-bust JS/CSS (Cloudflare + 1h nginx cache) with the commit short SHA
            ./scripts/stamp_assets.sh "$(git rev-parse --short HEAD)" *.html 